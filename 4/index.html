<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick і Morty персонажі</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="max-w-xl mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">Rick і Morty персонажі</h1>
    
    <div id="characters-container" class="space-y-4"></div>

    <div id="loading-indicator" class="text-center py-10 font-bold text-gray-500 hidden">
        Loading more characters...
    </div>
</div>

<div id="modal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50">
    <div id="modal-container" class="bg-white rounded-2xl max-w-sm w-full p-6 relative shadow-2xl">
        <button id="close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-black text-3xl">&times;</button>
        
        <div id="modal-content" class="text-center">
            </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
